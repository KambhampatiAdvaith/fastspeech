# FastSpeech 2 configuration for Telugu (IndicTTS_Telugu). One file = preprocess + model + train sections.
# Run every script from the project root, e.g.  python Telugu/train.py
preprocess:
  dataset: "IndicTTS_Telugu"
  path:
    raw_path: "./raw_data/Telugu"                      # wav + .lab files (written by the select step)
    preprocessed_path: "./preprocessed_data/Telugu"    # TextGrid/, mel/, pitch/, energy/, duration/, train.txt, val.txt
    lexicon_path: ""                               # unused: front ends are in fastspeech2/text/
  preprocessing:
    val_size: 600                                  # overwritten by the explicit split (val_ids.txt), see utils/pipeline.py
    text:
      text_cleaners: ["basic_cleaners"]
      language: "te"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000          # required by the pretrained HiFi-GAN vocoder
    pitch:
      feature: "phoneme_level"
      normalization: True
    energy:
      feature: "phoneme_level"
      normalization: True

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: True                                 # single speaker: one IndicTTS voice
  max_seq_len: 1500
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"

train:
  path:
    ckpt_path: "./Telugu/checkpoints"
    log_path: "./output/log/Telugu"
    result_path: "./output/result/Telugu"
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 1000                              # reference: 4000 (for 900k steps); we train far fewer steps
    anneal_steps: [10000, 15000]
    anneal_rate: 0.3
  step:
    total_step: 20000
    log_step: 100
    synth_step: 1000
    val_step: 1000
    save_step: 4000
